<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- FRAMEWORK BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTWFsp3y2vd56vVvhpuuCOmLASjC" crossorigin="anonymous">
    <!-- LIBRERIA DE ICONOS -->
    <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>
    <!-- FAVICON DE LA APLICACION DE MATRICULA -->
    <link rel="shortcut icon" href="img/Imagen1-removebg-preview.ico" type="image/x-icon">
    <!-- HOJA DE ESTILOS -->
    <link rel="stylesheet" href="css/indexstyles.css">
    </head>

<body>
    <article class="container">
        <form id="formRegistro" class="formulario">
            <h2 class="titulo">Registro de Nuevo Alumno</h2>
            <input type="text" id="regNombres" name="nombres" placeholder="Nombres" required>
            <input type="text" id="regApellidos" name="apellidos" placeholder="Apellidos" required>
            <input type="text" id="regDni" name="dni" placeholder="N° DNI (8 dígitos)" maxlength="8" required>
            <input type="email" id="regCorreo" name="correo" placeholder="Correo Electrónico" required>
            <input class="fecha" type="date" id="regNacimiento" name="nacimiento" required>

            <input type="text" id="apoNombres" name="apoNombres" placeholder="Nombres del Apoderado" required>
            <input type="text" id="apoCelular" name="apoCelular" placeholder="Celular del Apoderado" maxlength="9" required>

            <button class="submit" type="submit">Registrarse</button>
            <p id="mensajeRegistro" class="mensaje"></p>
        </form>

        <button class="submit2" id="btnAlternarVista">
            <a href="login.html"> Ya tengo cuenta / Iniciar Sesión </a>
        </button>
    </article>

    <script src="js/app.js"></script>
    <!-- LIBRERIA -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
