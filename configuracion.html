<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Matrícula OnLine</title>
    <!-- FRAMEWORK BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- LIBRERÍA DE ICONOS -->
    <script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>
    <!-- FAVICON -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <!-- FUENTES DE GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- HOJA DE ESTILOS -->
    <link rel="stylesheet" href="css/styles-dashboard.css">
    <!-- LIBRERÍA JQUERY -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="containers">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>SISTEMA DE MATRÍCULA</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard2.html"><i class="fa-solid fa-house"></i>Dashboard</a></li>
                    <li><a href="estudiantes.html"><i class="fa-solid fa-user-graduate"></i>Estudiantes</a></li>
                    <li><a href="cursos.html"><i class="fa-solid fa-book"></i>Cursos/Grados</a></li>
                    <li><a href="aulas.html"><i class="fa-solid fa-chalkboard"></i>Aulas</a></li>
                    <li><a href="matriculas.html"><i class="fa-solid fa-file-contract"></i>Matrículas</a></li>
                    <li><a href="pagos.html"><i class="fa-solid fa-money-bill-wave"></i>Pagos</a></li>
                    <li class="active"><a href="configuracion.html"><i class="fa-solid fa-gear"></i>Configuración</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <img src="" alt="Avatar">
                    <div class="user-info">
                        <h3>Administrador</h3>
                        <a href="#">Ver perfil</a>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h2>Panel de Administración</h2>
                </div>
                <div class="header-right">
                    <i class="fa-solid fa-bell"></i>
                    <div class="search-bar">
                        <input type="text" placeholder="Buscar...">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div class="user-dropdown">
                        <img src="" alt="Fabian Andre">
                        <h3>Fabian Andre <i class="fa-solid fa-chevron-down"></i></h3>
                    </div>
                </div>
            </header>

            <div class="content-body">

                <!-- SECCIÓN 1: DATOS DEL COLEGIO -->
                <div class="config-section">
                    <div class="config-section-header">
                        <i class="fa-solid fa-school"></i>
                        <h3>Datos del Colegio</h3>
                    </div>
                    <form id="formColegio">
                        <div class="config-body">
                            <div class="config-grid">
                                <div class="form-group">
                                    <label>Nombre del Colegio</label>
                                    <input type="text" id="nombre_colegio" name="nombre_colegio" placeholder="Ej: I.E. San Martín">
                                </div>
                                <div class="form-group">
                                    <label>Correo Institucional</label>
                                    <input type="email" id="correo" name="correo" placeholder="colegio@gmail.com">
                                </div>
                                <div class="form-group">
                                    <label>Dirección</label>
                                    <input type="text" id="direccion" name="direccion" placeholder="Av. Principal 123">
                                </div>
                                <div class="form-group">
                                    <label>Teléfono</label>
                                    <input type="text" id="telefono" name="telefono" placeholder="01-1234567">
                                </div>
                            </div>
                        </div>
                        <div class="config-footer">
                            <button type="submit" class="btn-guardar">
                                <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>

                <!-- SECCIÓN 2: AÑO ESCOLAR -->
                <div class="config-section">
                    <div class="config-section-header">
                        <i class="fa-solid fa-calendar-days"></i>
                        <h3>Año Escolar Activo</h3>
                    </div>
                    <form id="formAnio">
                        <div class="config-body">
                            <div class="config-grid single">
                                <div class="form-group">
                                    <label>Año Escolar Vigente</label>
                                    <select id="anio_escolar" name="anio_escolar">
                                        <option value="2023">2023</option>
                                        <option value="2024">2024</option>
                                        <option value="2025" selected>2025</option>
                                        <option value="2026">2026</option>
                                        <option value="2027">2027</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="config-footer">
                            <button type="submit" class="btn-guardar">
                                <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>

                <!-- SECCIÓN 3: CAMBIAR CONTRASEÑA -->
                <div class="config-section">
                    <div class="config-section-header">
                        <i class="fa-solid fa-lock"></i>
                        <h3>Cambiar Contraseña del Administrador</h3>
                    </div>
                    <form id="formPassword">
                        <div class="config-body">
                            <div class="config-grid">
                                <div class="form-group">
                                    <label>Contraseña Actual</label>
                                    <div class="password-wrapper">
                                        <input type="password" id="password_actual" name="password_actual" placeholder="Contraseña actual">
                                        <i class="fa-solid fa-eye toggle-pass" data-target="password_actual"></i>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <!-- espacio vacío para mantener el grid -->
                                </div>
                                <div class="form-group">
                                    <label>Nueva Contraseña</label>
                                    <div class="password-wrapper">
                                        <input type="password" id="password_nueva" name="password_nueva" placeholder="Nueva contraseña">
                                        <i class="fa-solid fa-eye toggle-pass" data-target="password_nueva"></i>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Confirmar Contraseña</label>
                                    <div class="password-wrapper">
                                        <input type="password" id="password_confirmar" name="password_confirmar" placeholder="Repetir nueva contraseña">
                                        <i class="fa-solid fa-eye toggle-pass" data-target="password_confirmar"></i>
                                    </div>
                                    <span class="alert-password" id="alertPassword">Las contraseñas no coinciden.</span>
                                </div>
                            </div>
                        </div>
                        <div class="config-footer">
                            <button type="submit" class="btn-guardar">
                                <i class="fa-solid fa-floppy-disk"></i> Cambiar Contraseña
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <!-- LIBRERIA SWEET ALERT -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- LIBRERIA JS DE BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <!-- ARCHIVO JS -->
    <script src="js/configuracion.js"></script>
</body>
</html>
